<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #08080d;
  color: #fff;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px 45px;
}

.badge {
  display: inline-block;
  padding: 7px 14px;
  border-radius: 30px;
  background: #191928;
  color: #a78bfa;
  font-size: 13px;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(38px, 8vw, 64px);
  margin-bottom: 15px;
}

.hero p {
  color: #a1a1aa;
  max-width: 600px;
  margin: 0 auto 28px;
  line-height: 1.6;
}

.download {
  display: inline-block;
  text-decoration: none;
  color: white;
  font-size: 19px;
  font-weight: bold;
  padding: 17px 34px;
  border-radius: 14px;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  box-shadow: 0 12px 35px rgba(79, 70, 229, 0.35);
}

.download:hover {
  transform: translateY(-2px);
}

.info {
  margin-top: 13px;
  color: #71717a;
  font-size: 13px;
}

/* RATING */
.rating {
  width: min(420px, 90%);
  margin: 10px auto 55px;
  text-align: center;
  padding: 22px;
  background: #111118;
  border: 1px solid #242432;
  border-radius: 20px;
}

.stars {
  color: #fbbf24;
  font-size: 27px;
  letter-spacing: 3px;
}

.score {
  font-size: 28px;
  font-weight: bold;
  margin-top: 7px;
}

.rating small {
  display: block;
  color: #71717a;
  margin-top: 5px;
}

/* GALLERY */
.section {
  width: min(1100px, 92%);
  margin: auto;
}

.section h2 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 25px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding-bottom: 60px;
}

/* CARD */
.card {
  display: block;
  text-decoration: none;
  color: white;
  background: #111118;
  border: 1px solid #242432;
  border-radius: 18px;
  overflow: hidden;
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #6366f1;
}

.card img {
  width: 100%;
  height: 280px;
  display: block;
  object-fit: cover;
}

/* PROFILE INFORMATION */
.profile-info {
  padding: 16px;
}

.profile-name {
  display: block;
  font-size: 20px;
  font-weight: bold;
  color: white;
  margin-bottom: 9px;
}

.profile-detail {
  display: block;
  color: #a1a1aa;
  font-size: 14px;
  margin-top: 5px;
}

/* FOOTER */
footer {
  border-top: 1px solid #20202a;
  text-align: center;
  color: #71717a;
  padding: 25px;
  font-size: 13px;
}

/* MOBILE */
@media (max-width: 700px) {

  .gallery {
    grid-template-columns: 1fr;
  }

  .card img {
    height: 260px;
  }

  .download {
    width: 100%;
    max-width: 360px;
  }
}
</style>
</head>
